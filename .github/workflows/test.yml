name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  flutter-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@480ffd9d3a24db4ce099d7ceb62c3d6959661eb8
        with:
          channel: stable
          version: latest
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: dart analyze

      - name: Run tests
        run: flutter test

      - name: Verify the package is publishable
        run: |
          # Validate the committed tree, not the working tree. The Flutter tool rewrites
          # analysis_options.yaml on newer SDKs, and `pub publish` refuses to validate a
          # repository whose checked-in files are modified — so the working tree fails for
          # a reason that has nothing to do with the package. `git archive` hands pub
          # exactly the bytes a publish would upload, with no .git to trip over.
          git diff --stat
          mkdir -p "$RUNNER_TEMP/pkgcheck"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/pkgcheck"
          cd "$RUNNER_TEMP/pkgcheck"
          flutter pub publish --dry-run
